<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Jota · food search playground</title>
  <style>
    :root {
      --forest: #103b2d;
      --cream: #f7f8f3;
      --lime: #b7ec92;
      --ink: #16382c;
      --muted: rgba(16, 59, 45, 0.58);
      --line: rgba(16, 59, 45, 0.12);
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--cream);
    }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .lede { color: var(--muted); margin: 0 0 24px; }
    .bar {
      display: flex; gap: 8px; align-items: center;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 8px 8px 8px 16px;
    }
    input[type="search"], input[type="password"] {
      flex: 1; border: 0; outline: 0; background: transparent;
      font: inherit; color: inherit; min-height: 40px;
    }
    .key-row { display: flex; gap: 8px; margin: 12px 0 20px; align-items: center; }
    .key-row input {
      flex: 1; border: 1px solid var(--line); border-radius: 10px;
      padding: 8px 12px; background: var(--card);
    }
    .hint { font-size: 12px; color: var(--muted); }
    .status { min-height: 1.4em; font-size: 13px; color: var(--muted); margin: 12px 0; }
    .status.error { color: #8a1f1f; }
    .list { display: flex; flex-direction: column; gap: 8px; }
    button.row, .panel {
      text-align: left; width: 100%; border: 1px solid var(--line);
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      font: inherit; color: inherit; cursor: pointer;
    }
    button.row:hover { border-color: var(--forest); }
    .name { font-weight: 650; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .protein { float: right; font-weight: 700; color: var(--forest); }
    .panel { cursor: default; margin-top: 16px; background: var(--forest); color: var(--cream); }
    .panel .meta { color: rgba(247, 248, 243, 0.7); }
    .panel .protein { color: var(--lime); float: none; font-size: 40px; letter-spacing: -0.04em; }
    .panel .protein span { font-size: 18px; font-weight: 500; }
    .step { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
    .step button {
      width: 40px; height: 40px; border-radius: 12px; border: 0;
      background: var(--lime); color: var(--forest); font: 700 20px inherit; cursor: pointer;
    }
    .accept {
      margin-top: 16px; width: 100%; border: 0; border-radius: 12px;
      background: var(--lime); color: var(--forest); font: 650 16px inherit;
      min-height: 48px; cursor: pointer;
    }
    .toast { margin-top: 10px; font-size: 13px; color: var(--lime); }
  </style>
</head>
<body>
  <main>
    <h1>Food search playground</h1>
    <p class="lede">Same USDA path the app uses. Unlisted — not linked from the product.</p>
    <div class="bar">
      <input id="q" type="search" placeholder="Search foods" autocomplete="off" autofocus />
    </div>
    <div class="key-row">
      <input id="key" type="password" placeholder="Access key (required on prod)" autocomplete="off" />
      <span class="hint">Saved in this tab only</span>
    </div>
    <p class="status" id="status">Type at least 2 characters. Data: USDA FoodData Central.</p>
    <div class="list" id="list"></div>
    <div id="detail"></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const stored = sessionStorage.getItem('jota-playground-key') || params.get('key') || '';
    if (stored) $('key').value = stored;
    $('key').addEventListener('change', () => sessionStorage.setItem('jota-playground-key', $('key').value.trim()));

    let timer = 0;
    let selected = null;
    let servings = 1;

    $('q').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(search, 300);
    });

    async function search() {
      const q = $('q').value.trim();
      selected = null;
      $('detail').innerHTML = '';
      if (q.length < 2) {
        $('list').innerHTML = '';
        $('status').textContent = 'Type at least 2 characters. Data: USDA FoodData Central.';
        $('status').className = 'status';
        return;
      }
      $('status').className = 'status';
      $('status').textContent = 'Searching USDA…';
      const key = $('key').value.trim();
      sessionStorage.setItem('jota-playground-key', key);
      const url = new URL('/api/dev/search', location.origin);
      url.searchParams.set('q', q);
      if (key) url.searchParams.set('key', key);
      try {
        const res = await fetch(url);
        const body = await res.json();
        if (!res.ok) {
          $('list').innerHTML = '';
          $('status').className = 'status error';
          $('status').textContent = body.error?.message || `Error ${res.status}`;
          return;
        }
        const results = body.results || [];
        $('status').textContent = `${results.length} result${results.length === 1 ? '' : 's'} · ${body.source || 'usda'} · “${body.query}”`;
        $('list').innerHTML = results.map((food, i) => `
          <button class="row" data-i="${i}" type="button">
            <span class="protein">${Math.round(food.proteinG)}g</span>
            <div class="name">${escapeHtml(food.name)}</div>
            <div class="meta">${escapeHtml([food.brand, food.servingDescription].filter(Boolean).join(' · '))}</div>
          </button>
        `).join('') || '<p class="hint">No USDA matches.</p>';
        $('list').onclick = e => {
          const btn = e.target.closest('button.row');
          if (!btn) return;
          openDetail(results[Number(btn.dataset.i)]);
        };
      } catch (err) {
        $('status').className = 'status error';
        $('status').textContent = err.message || 'Network error';
      }
    }

    function openDetail(food) {
      selected = food;
      servings = 1;
      renderDetail();
    }

    function renderDetail() {
      const food = selected;
      if (!food) return;
      const protein = Math.round(food.proteinG * servings * 10) / 10;
      $('detail').innerHTML = `
        <div class="panel">
          <div class="name">${escapeHtml(food.name)}</div>
          <div class="meta">${escapeHtml([food.brand, food.servingDescription].filter(Boolean).join(' · '))}</div>
          <div class="protein">${protein}<span>g protein</span></div>
          <div class="step">
            <span>Servings</span>
            <span>
              <button type="button" data-d="-0.5">−</button>
              <strong style="display:inline-block;min-width:3ch;text-align:center">${servings}</strong>
              <button type="button" data-d="0.5">+</button>
            </span>
          </div>
          <button class="accept" type="button" id="accept">Accept · ${protein}g</button>
          <div class="toast" id="toast"></div>
        </div>
      `;
      $('detail').querySelectorAll('[data-d]').forEach(btn => {
        btn.addEventListener('click', () => {
          servings = Math.min(20, Math.max(0.5, Math.round((servings + Number(btn.dataset.d)) * 10) / 10));
          renderDetail();
        });
      });
      $('accept').addEventListener('click', () => {
        $('toast').textContent = `Would log ${protein}g · source search · not saved (playground)`;
      });
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>
</body>
</html>
